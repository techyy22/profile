<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="utf-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <title>
        {% block title %}Portfolio{% endblock %}
    </title>

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css"
        integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm"
        crossorigin="anonymous">

    <style>

        body {
            background-color: #f8f9fa;
            color: #212529;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                         Roboto, Helvetica, Arial, sans-serif;
        }

        .site-navbar {
            background-color: #0b3d2e !important;
            padding: 0.75rem 1rem;
        }

        .site-navbar .navbar-brand {
            color: white !important;
            font-weight: 700;
            letter-spacing: 0.2px;
        }

        .site-navbar .navbar-brand:hover {
            color: #dfeee7 !important;
        }

        .site-navbar .nav-link {
            color: #dfeee7 !important;
            margin-left: 0.35rem;
            margin-right: 0.35rem;
            border-radius: 6px;
            transition: background-color 0.2s ease,
                        color 0.2s ease;
        }

        .site-navbar .nav-link:hover {
            color: white !important;
            background-color: rgba(255, 255, 255, 0.1);
        }

        .site-navbar .nav-link.active {
            color: white !important;
            background-color: rgba(255, 255, 255, 0.16);
            font-weight: 600;
        }

        .navbar-toggler {
            border: 1px solid rgba(255, 255, 255, 0.35);
        }

        .navbar-toggler:focus {
            outline: none;
            box-shadow: none;
        }

        .navbar-toggler-icon {
            background-image: url(
                "data:image/svg+xml;charset=utf8,%3Csvg viewBox='0 0 30 30' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath stroke='white' stroke-width='2' stroke-linecap='round' d='M4 7h22M4 15h22M4 23h22'/%3E%3C/svg%3E"
            );
        }

        main {
            min-height: calc(100vh - 70px);
        }

        .site-footer {
            margin-top: 4rem;
            padding: 2rem 1rem;
            text-align: center;
            color: #6c757d;
            font-size: 0.9rem;
        }

    </style>

    
    <script
        src="https://code.jquery.com/jquery-3.2.1.slim.min.js"
        integrity="sha384-KJ3o2DKtIkvYIK3UENzmM7KCkRr/rE9/Qpg6aAZGJwFDMVNA/GpGFF93hXpG5KkN"
        crossorigin="anonymous">
    </script>

    
    <script
        src="https://cdn.jsdelivr.net/npm/popper.js@1.12.9/dist/umd/popper.min.js"
        integrity="sha384-ApNbgh9B+Y1QKtv3RnXl3dF3QJj2kK3g9pX6kY6lG6L7mK8hK8vK8sK8hK8"
        crossorigin="anonymous">
    </script>

    
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/js/bootstrap.min.js"
        integrity="sha384-JZR6Spejh4U02d8jOt6vLEHfe/JQGiRRSQQxSfFWpi1MquVdAyjUar5+76PVCmYl"
        crossorigin="anonymous">
    </script>

</head>


<body>

    <!-- NAVIGATION -->
    <nav class="navbar navbar-expand-lg site-navbar">

        <div class="container">

            <a class="navbar-brand" href="/home">
                Portfolio
            </a>

            <button
                class="navbar-toggler"
                type="button"
                data-toggle="collapse"
                data-target="#navbarSupportedContent"
                aria-controls="navbarSupportedContent"
                aria-expanded="false"
                aria-label="Toggle navigation"
            >
                <span class="navbar-toggler-icon"></span>
            </button>


            <div
                class="collapse navbar-collapse"
                id="navbarSupportedContent"
            >

                <ul class="navbar-nav ml-auto">

                    <li class="nav-item">
                        <a
                            class="nav-link {% if request.endpoint == 'home' %}active{% endif %}"
                            href="/home"
                        >
                            Home
                        </a>
                    </li>

                    <li class="nav-item">
                        <a
                            class="nav-link {% if request.endpoint == 'about_me' %}active{% endif %}"
                            href="/about-me"
                        >
                            About Me
                        </a>
                    </li>

                    <li class="nav-item">
                        <a
                            class="nav-link {% if request.endpoint == 'projects' %}active{% endif %}"
                            href="/projects"
                        >
                            Projects
                        </a>
                    </li>

                    <li class="nav-item">
                        <a
                            class="nav-link {% if request.endpoint == 'resume' %}active{% endif %}"
                            href="/resume"
                        >
                            Experience
                        </a>
                    </li>

                </ul>

            </div>

        </div>

    </nav>


    <!-- MAIN CONTENT -->
    <main>

        {% block content %}
        {% endblock %}

    </main>


    <!-- FOOTER -->
    <footer class="site-footer">

        <div class="container">
            <p class="mb-0">
                Computer Science Student · IT Support · Web & Automation
            </p>
        </div>

    </footer>

</body>

</html>
